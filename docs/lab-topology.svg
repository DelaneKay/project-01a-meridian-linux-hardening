<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Project 1a Meridian Linux hardening lab topology</title>
<desc id="desc">A Windows workstation uses a host-only management path to mds-admin-01. The admin VM manages mds-ubuntu-server-01 over the mds-sec-lab internal network.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#327A9B"/></marker>
  <style>
    .title{font:700 26px Segoe UI,Arial,sans-serif;fill:#17324D}
    .subtitle{font:15px Segoe UI,Arial,sans-serif;fill:#526579}
    .head{font:700 19px Segoe UI,Arial,sans-serif;fill:#17324D}
    .sub{font:13px Segoe UI,Arial,sans-serif;fill:#526579}
    .body{font:14px Segoe UI,Arial,sans-serif;fill:#263849}
    .bold{font:700 14px Segoe UI,Arial,sans-serif;fill:#17324D}
    .edge{font:700 13px Segoe UI,Arial,sans-serif;fill:#17324D}
    .note{font:13px Segoe UI,Arial,sans-serif;fill:#34495E}
  </style>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text class="title" x="50" y="57">Project 1a: Meridian Linux hardening lab</text>
<text class="subtitle" x="50" y="91">Local VirtualBox setup: workstation → admin/control VM → reporting target</text>
<rect x="50" y="130" width="280" height="360" rx="16" fill="#EAF3F8" stroke="#5A8EAA" stroke-width="2"/>
<text class="head" x="72" y="169">Windows Workstation</text>
<text class="sub" x="72" y="193">Operator laptop</text>
<text class="bold" x="72" y="232">Windows PowerShell / OpenSSH</text>
<text class="body" x="72" y="256">SCP: mds-induction.zip</text>
<text class="body" x="72" y="276">to mds-admin-01</text>
<text class="bold" x="72" y="323">WSL / OpenSSH</text>
<text class="body" x="72" y="347">Lynis transfer and SSH</text>
<text class="body" x="72" y="367">administration</text>
<rect x="455" y="130" width="310" height="360" rx="16" fill="#EDF6EE" stroke="#5A9A68" stroke-width="2"/>
<text class="head" x="477" y="169">mds-admin-01</text>
<text class="sub" x="477" y="193">Ubuntu admin / Ansible control VM</text>
<text class="bold" x="477" y="232">Adapter 2 · Host-only</text>
<text class="body" x="477" y="256">192.168.56.101</text>
<text class="bold" x="477" y="295">Adapter 3 · Internal Network</text>
<text class="body" x="477" y="319">mds-sec-lab</text>
<text class="body" x="477" y="341">Archive expects 192.168.77.20</text>
<text class="body" x="477" y="361">(guest IP not confirmed)</text>
<text class="body" x="477" y="406">Ansible inventory and playbooks</text>
<rect x="890" y="130" width="260" height="360" rx="16" fill="#FFF4E5" stroke="#D49A45" stroke-width="2"/>
<text class="head" x="912" y="169">mds-ubuntu-server-01</text>
<text class="sub" x="912" y="193">Ubuntu reporting target VM</text>
<text class="bold" x="912" y="232">Adapter 1 · NAT</text>
<text class="body" x="912" y="256">Disabled</text>
<text class="bold" x="912" y="295">Adapter 2 · Internal Network</text>
<text class="body" x="912" y="319">mds-sec-lab</text>
<text class="body" x="912" y="341">Inventory: 192.168.77.10</text>
<text class="body" x="912" y="386">Meridian reporting service</text>
<text class="body" x="912" y="408">Account: mds-reports</text>
<line x1="330" y1="306" x2="455" y2="306" stroke="#327A9B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="322" y="222" width="143" height="54" rx="8" fill="#fff" stroke="#d7e2ea"/>
<text class="edge" x="393.5" y="243" text-anchor="middle">SSH / SCP</text>
<text class="sub" x="393.5" y="262" text-anchor="middle">Host-only</text>
<line x1="765" y1="306" x2="890" y2="306" stroke="#327A9B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="750" y="222" width="155" height="54" rx="8" fill="#fff" stroke="#d7e2ea"/>
<text class="edge" x="827.5" y="243" text-anchor="middle">SSH / SCP</text>
<text class="sub" x="827.5" y="262" text-anchor="middle">Ansible · mds-sec-lab</text>
<rect x="50" y="540" width="1100" height="135" rx="12" fill="#F3F5F7" stroke="#AAB5C0"/>
<text class="bold" x="72" y="571">Evidence limits</text>
<text class="note" x="72" y="597">Adapter 1 (NAT) is recorded disabled on both VMs. Admin Adapter 4 and target Adapters 3–4 were not documented.</text>
<text class="note" x="72" y="621">The adapter record does not prove guest routing or complete egress isolation.</text>
<text class="note" x="72" y="645">The ZIP was copied to the admin VM; its deployment as the target seed is unverified.</text>
</svg>